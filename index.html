<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>crisjonks</title>
  <meta name="description" content="Profile homepage" />
  <link rel="icon" type="image/x-icon" href="/icons/logo.ico">
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <noscript><style>.gate{display:none!important}body.locked .card,body.locked .time,body.locked .player{opacity:1!important;animation-play-state:running!important}</style></noscript>
</head>
<body class="locked">
  <div class="gate" id="gate" role="button" tabindex="0" aria-label="Click to enter">
    <span class="gate-text">click anywhere to enter<span class="gate-cursor"></span></span>
  </div>

  <main class="card" id="profile-card" role="main">
    <div class="top">
      <div class="avatar" aria-hidden="true">
        <img id="avatar-img" src="/icons/crisjonks.png" alt="avatar">
      </div>

      <div class="meta" style="flex:1">
        <div class="header-row">
          <div class="header-column">
            <h1 class="name" id="display-name">crisjonks</h1>
            <div class="status-bar" id="status-bar" aria-live="polite" aria-label="Current activity">
              <span class="status-text" id="status-text"></span><span class="status-cursor"></span>
            </div>
          </div>

          <div class="header-actions">
            <button id="links-btn" class="links-btn" aria-label="links" type="button">Links</button>
            <button id="projects-btn" class="projects-btn" aria-label="projects" type="button">Projects</button>
            <button id="contact-btn" class="contact-btn" aria-label="contact" type="button">Contact</button>
          </div>
        </div>

        <div class="content-stack">
          <ul class="tag-list" id="tag-list" aria-label="Short bio">
            <li tabindex="0"><span class="tag-text">python</span></li>
            <li tabindex="0"><span class="tag-text">html/css/js</span></li>
            <li tabindex="0"><span class="tag-text">luau</span></li>
          </ul>

          <section id="projects-container" class="projects hidden" aria-label="Projects list"></section>

          <section id="contact-container" class="contact hidden" aria-label="Contact section">
            <div class="project">
              <span class="project-name">contact</span>
              <span class="project-desc">coming soon</span>
            </div>
          </section>

          <div class="icons" id="icons">
            <button class="social-link" data-username="@crisjonks" data-url="https://github.com/crisjonks" data-img="/icons/github.png" aria-label="GitHub" title="GitHub" type="button">
              <img class="social-img" src="/icons/github.png" alt="GitHub">
            </button>

            <button class="social-link" data-username="@crisjonx" data-url="https://codeberg.org/crisjonx" data-img="/icons/codeberg.png" aria-label="Codeberg" title="Codeberg" type="button">
              <img class="social-img" src="/icons/codeberg.png" alt="Codeberg">
            </button>

            <button class="social-link" data-username="@crisjonks" data-url="https://gitlab.com/crisjonks" data-img="/icons/gitlab.png" aria-label="GitLab" title="GitLab" type="button">
              <img class="social-img" src="/icons/gitlab.png" alt="GitLab">
            </button>
            
            <button class="social-link" data-username="@C7ulmr" data-url="https://discord.com/users/823669455271362651" data-img="/icons/discord.png" aria-label="Discord" title="Discord" type="button">
              <img class="social-img" src="/icons/discord.png" alt="Discord">
            </button>

            <button class="social-link" data-username="@C7ulmr" data-url="https://www.roblox.com/users/1612618833/profile" data-img="/icons/roblox.png" aria-label="Roblox" title="Roblox" type="button">
              <img class="social-img" src="/icons/roblox.png" alt="Roblox">
            </button>

            <button class="social-link" data-username="@C7ulmr" data-url="https://steamcommunity.com/profiles/76561199851082093/" data-img="/icons/steam.png" aria-label="Steam" title="Steam" type="button">
              <img class="social-img" src="/icons/steam.png" alt="Steam">
            </button>

            <button class="social-link" data-username="@C7ulmr" data-url="https://namemc.com/profile/C7ulmr.1" data-img="/icons/namemc.png" aria-label="NameMC" title="NameMC" type="button">
              <img class="social-img" src="/icons/namemc.png" alt="NameMC">
            </button>

            
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="time" id="my-time" data-tooltip="">my time is --:-- --, UTC-5</div>

  <audio id="click-sound" src="/pop.mp3" preload="auto"></audio>

  <div class="player" id="player">
    <button class="player-btn" id="player-btn" type="button" aria-label="Play music" aria-pressed="false">
      <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="currentColor"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg>
    </button>
    <span class="player-title">Asleep In Space 4</span>
    <span class="player-bars" aria-hidden="true"><i></i><i></i><i></i></span>
  </div>

  <script src="script.js"></script>
</body>
</html>
